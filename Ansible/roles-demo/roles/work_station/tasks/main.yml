- name: Install Unzip
  tags: unzip
  package:
    name: unzip
- name: Install terraform
  tags: terraform
  unarchive:
    src: https://releases.hashicorp.com/terraform/1.16.2/terraform_1.16.2_linux_amd64.zip
    dest: /usr/local/bin
    remote_src: yes
    owner: root
    group: root
    mode: 0755
    validate_certs: no