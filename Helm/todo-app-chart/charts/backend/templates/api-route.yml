apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: api-java
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.global.hostname }}`) && PathPrefix(`/api`)
      middlewares:
        - name: strip-api-prefixes
      services:
        - kind: Service
          name: api-java
          port: 8080
          scheme: http
