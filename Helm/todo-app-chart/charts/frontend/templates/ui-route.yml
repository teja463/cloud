apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.global.hostname }}`)
      services:
        - kind: Service
          name: {{ .Release.Name }}-{{ .Chart.Name }}
          port: 80
          scheme: http