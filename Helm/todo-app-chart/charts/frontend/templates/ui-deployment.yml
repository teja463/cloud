apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}
    spec:
      containers:
        - image: {{ .Values.imagepath }}:{{ .Values.image_version }}
          name: {{ .Release.Name }}-{{ .Chart.Name }}
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/nginx/conf.d
              name: {{ .Release.Name }}-{{ .Chart.Name }}-conf
      volumes:
        - configMap:
            defaultMode: 420
            name: {{ .Release.Name }}-{{ .Chart.Name }}-conf
          name: {{ .Release.Name }}-{{ .Chart.Name }}-conf