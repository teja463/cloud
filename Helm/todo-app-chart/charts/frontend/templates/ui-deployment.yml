apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-react-nginx
  labels:
    app: client-react-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-react-nginx
  template:
    metadata:
      labels:
        app: client-react-nginx
    spec:
      containers:
        - image: teja463/todo-app-frontend:1.0.0
          name: client-react-nginx
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/nginx/conf.d
              name: nginx-conf
      volumes:
        - configMap:
            defaultMode: 420
            name: nginx-conf
          name: nginx-conf