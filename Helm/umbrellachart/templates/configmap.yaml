apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mychart.fullname" . }}
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
data:
  name: {{ .Values.name }}
{{- $chartName := .Chart.Name -}}
{{- with .Values.favorite }}  
  drink: {{ .drink }}
  food: {{ .food }}
  chartname: {{ $chartName | quote }}
{{- end }}
{{ indent 2 .Values.indent_demo }}
{{- if eq .Values.favorite.drink "coffee"}}
  coffee_type: "Espresso"
{{- end }}
  toppings:
  {{- range .Values.pizzaToppings }}
    - {{ . | title | quote }}
  {{- end }}
  toppings_map:
  {{- range $index, $value := .Values.pizzaToppings }}
    {{ $index }}: {{ $value }}
  {{- end }}
  favourites:
  {{- range $index, $value := .Values.favorite }}
    {{ $index }}: {{ $value }}
  {{- end }}